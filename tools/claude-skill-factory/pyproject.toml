[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-skill-factory"
version = "0.1.0"
description = "Local-first installable CLI that turns repeated Claude Code prompts into approval-gated, reusable Claude Code skills."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Claude Skill Factory Contributors" }]
keywords = ["claude", "claude-code", "skill", "prompt", "cli", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
claude-skill-factory = "skill_factory.cli:app"

[project.urls]
Homepage = "https://github.com/coreline-ai/claude-skill-factory"
Repository = "https://github.com/coreline-ai/claude-skill-factory"
Changelog = "https://github.com/coreline-ai/claude-skill-factory/blob/main/CHANGELOG.md"
Documentation = "https://github.com/coreline-ai/claude-skill-factory/tree/main/docs"
Issues = "https://github.com/coreline-ai/claude-skill-factory/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skill_factory*"]

[tool.setuptools.package-data]
skill_factory = ["templates/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API uses ``typer.Option(...)`` as default values.
"skill_factory/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
